# Bootstrap config for test target container

[target]
SSH_TIMEOUT = 10
SSH_RETRIES = 3
SSH_KEY_FILE = tests/target/ssh_keys/id_ed25519
SSH_STRICT_HOST_KEY_CHECKING = no
SSH_PORT = 2222
SSH_USER = testuser

[timeouts]
DISCOVERY = 30
PREREQUISITES = 60
INITIAL_SETUP = 120
REBOOT_WAIT = 60
SECRETS = 60
DEPLOYMENT_BASE = 300
DEPLOYMENT_SECURITY = 300
VERIFICATION = 60

[deploy]
# Test environment paths (must match docker-compose volume mounts)
EDGE_SERVER_DIR = /tmp/edge-server-test
EDGE_STORAGE_DIR = /tmp/edge-server-test-storage
