services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto-test
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - ha-test

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant-test
    ports:
      - "8123:8123"
    volumes:
      - ./ha-config:/config
    environment:
      - TZ=America/Los_Angeles
    depends_on:
      - mosquitto
    networks:
      - ha-test

  mqtt-simulator:
    build:
      context: .
      dockerfile: Dockerfile.simulator
    container_name: mqtt-simulator
    depends_on:
      - mosquitto
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_USER=admin
      - MQTT_PASS=testpass123
    networks:
      - ha-test

networks:
  ha-test:
    driver: bridge
