# gitleaks configuration for CI (Autonomy M9, IT-81). Same expected data as .secrets-allowlist.
# Paths are unanchored: in `gitleaks dir /repo` mode they are reported as /repo/<path>.
[extend]
useDefault = true

[allowlist]
description = "fake values in tests and the documented example Victron key"
paths = [
  '''(^|/)tests/''',
]
# The example key printed by `victron-shunt` help and shown in its README (not a device key).
regexes = ['''0df4d0395b7d1a876c0c33ecb9e70dcd''']
