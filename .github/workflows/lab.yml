name: Lab

# The edge node's lab (lab/): the real bot and compose from this checkout with Frigate and
# the host helpers as stand-ins, and a mocked Telegram API. Real containers, no real model,
# no hardware. On changes to lab/ and the bot, and nightly.
on:
  pull_request:
    paths: ["lab/**", "telegram-bot/**", "ha-addon/**", "deploy-edge-server.sh", ".github/workflows/lab.yml"]
  push:
    branches: [main]
    paths: ["lab/**"]
  workflow_dispatch:
  schedule:
    - cron: "37 6 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lab:
    name: lab up, /status, /restart, camera, /reboot
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LAB_DIR: /tmp/autonomy-lab
    steps:
      - uses: actions/checkout@v4
        with:
          path: edge_server
      - uses: actions/checkout@v4
        with:
          repository: realsystem/autonomy
          path: autonomy
      - name: Up with a mocked Telegram API (answers /status)
        run: edge_server/lab/lab.sh up --mock-telegram
      - name: A camera loses video, /status says so
        run: |
          edge_server/lab/lab.sh cam cam1_front 0
          edge_server/lab/lab.sh say "/status"
          for i in $(seq 1 15); do
            out="$(edge_server/lab/lab.sh replies 3)"
            case "$out" in *"NO VIDEO"*) exit 0 ;; esac
            sleep 2
          done
          edge_server/lab/lab.sh replies 3
          exit 1
      - name: /restart frigate with the lab TOTP code (host-stub runs the real helper)
        run: |
          edge_server/lab/lab.sh say "/restart frigate $(edge_server/lab/lab.sh code)"
          for i in $(seq 1 40); do
            out="$(edge_server/lab/lab.sh replies 5)"
            case "$out" in *"Restarted frigate"*) exit 0 ;; esac
            sleep 3
          done
          edge_server/lab/lab.sh replies 5
          exit 1
      - name: /reboot (simulated by host-stub), the bot comes back and says so
        run: |
          sleep 32 # a code is good once: wait for the next 30 s window
          edge_server/lab/lab.sh say "/reboot $(edge_server/lab/lab.sh code)"
          for i in $(seq 1 40); do
            out="$(edge_server/lab/lab.sh replies 5)"
            case "$out" in *"Back online after reboot"*) exit 0 ;; esac
            sleep 3
          done
          edge_server/lab/lab.sh replies 5
          exit 1
      - name: Logs
        if: always()
        run: edge_server/lab/lab.sh logs | tail -150
      - name: Reset
        if: always()
        run: edge_server/lab/lab.sh reset

  nodes:
    name: two nodes, cross-node control with the owner's TOTP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LAB_DIR: /tmp/autonomy-lab
    steps:
      - uses: actions/checkout@v4
        with:
          path: edge_server
      - uses: actions/checkout@v4
        with:
          repository: realsystem/autonomy
          path: autonomy
      - name: Up - an edge node and a Home Assistant add-on node, one mocked Telegram
        run: edge_server/lab/lab.sh up --mock-telegram --nodes
      - name: Each node's bot answers its own /status
        run: |
          edge_server/lab/lab.sh say "/status"
          edge_server/lab/lab.sh say --bot pi "/status"
          edge_server/lab/lab.sh wait "memory" 60
          edge_server/lab/lab.sh wait --bot pi "memory" 60
      - name: /fleet on each node lists the other (heartbeats)
        run: |
          for i in $(seq 1 12); do
            edge_server/lab/lab.sh say "/fleet"
            edge_server/lab/lab.sh say --bot pi "/fleet"
            sleep 10
            a="$(edge_server/lab/lab.sh replies 3)"
            b="$(edge_server/lab/lab.sh replies --bot pi 3)"
            case "$a" in *pi-1*) case "$b" in *edge-1*) exit 0 ;; esac ;; esac
          done
          edge_server/lab/lab.sh replies 3; edge_server/lab/lab.sh replies --bot pi 3
          exit 1
      - name: Edge restarts Home Assistant Core on the Pi node, with the Pi's owner code
        run: |
          edge_server/lab/lab.sh say "/remote pi-1 restart core $(edge_server/lab/lab.sh code pi)"
          edge_server/lab/lab.sh wait-call /core/restart 60
          edge_server/lab/lab.sh wait --bot pi "asked to restart core" 60
      - name: The Pi node asks the edge to restart Frigate, with the edge's owner code
        run: |
          edge_server/lab/lab.sh say --bot pi "/remote edge-1 restart frigate $(edge_server/lab/lab.sh code)"
          edge_server/lab/lab.sh wait "Restarted frigate" 120
      - name: A wrong code does nothing
        run: |
          sleep 12 # the sender pauses 10 s between /remote commands
          edge_server/lab/lab.sh say "/remote pi-1 reboot 000000"
          edge_server/lab/lab.sh wait --bot pi "Refused a request from edge-1" 60
          case "$(edge_server/lab/lab.sh pi-calls)" in *host/reboot*) echo "rebooted with a wrong code"; exit 1 ;; esac
      - name: A request outside the grant is refused even with a good code
        run: |
          sleep 12
          edge_server/lab/lab.sh say "/remote pi-1 restart core_mosquitto $(edge_server/lab/lab.sh code pi)"
          edge_server/lab/lab.sh wait --bot pi "Refused a request from edge-1" 60
          case "$(edge_server/lab/lab.sh pi-calls)" in *addons/core_mosquitto*) echo "restarted an add-on that is not granted"; exit 1 ;; esac
      - name: Reboot of the Pi host needs the code too, and then the Supervisor is asked
        run: |
          sleep 32 # a code is good once: wait for the next 30 s window
          edge_server/lab/lab.sh say "/remote pi-1 reboot $(edge_server/lab/lab.sh code pi)"
          edge_server/lab/lab.sh wait-call /host/reboot 90
      - name: Logs
        if: always()
        run: |
          edge_server/lab/lab.sh logs | tail -200
          edge_server/lab/lab.sh pi-calls
      - name: Reset
        if: always()
        run: edge_server/lab/lab.sh reset

  farm:
    name: /farm and farm alerts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LAB_DIR: /tmp/autonomy-lab
      LAB_FARM: "1" # turns on /farm and the farm alerts; the status file is written by hand below
    steps:
      - uses: actions/checkout@v4
        with:
          path: edge_server
      - uses: actions/checkout@v4
        with:
          repository: realsystem/autonomy
          path: autonomy
      - name: Up with a mocked Telegram API
        run: edge_server/lab/lab.sh up --mock-telegram
      - name: /farm shows the Field Station status file, and the alerts follow it
        run: |
          lab=edge_server/lab/lab.sh
          # wait_for PATTERN SECONDS: until the bot has said it (any of the last 8 messages)
          wait_for() {
            for _ in $(seq 1 $(($2 / 2))); do
              out="$($lab replies 8)"
              case "$out" in *"$1"*) return 0 ;; esac
              sleep 2
            done
            echo "no '$1' in $2 s; the bot said:"; $lab replies 8; exit 1
          }
          $lab farm-status ok 40
          $lab say "/farm"
          wait_for "WH51 ch3 soil moisture: 40 %" 30
          $lab farm-status ok 5                      # below the lab's rule (<10)
          wait_for "WH51 ch3 soil moisture is low: 5 %" 90
          $lab farm-status ok 40
          wait_for "WH51 ch3 soil moisture: back to normal" 90
          $lab farm-status stale                     # the cell stopped reporting
          wait_for "Field Station: not reporting" 90
          $lab farm-status ok 40
          wait_for "Field Station: back to normal" 90
      - name: Logs
        if: always()
        run: edge_server/lab/lab.sh logs telegram-bot | tail -80
      - name: Reset
        if: always()
        run: edge_server/lab/lab.sh reset
