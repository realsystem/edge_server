name: Test

# Uses only GitHub-hosted runners and GitHub's own actions (checkout,
# setup-python, upload-artifact). No third-party services: coverage is
# enforced with pytest-cov's --cov-fail-under, reported in the job summary and
# kept as a workflow artifact.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Weekly, so a new Frigate "stable" that rejects our configs is noticed
  # before the next deploy pulls it.
  schedule:
    - cron: "23 14 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  # --------------------------------------------------------------------------
  # Core bootstrap package (src/)
  # --------------------------------------------------------------------------
  python-test:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The suite also drives secrets.sh, the deploy scripts (sourced, with
      # docker/systemctl stubbed) and the NUT poller, so it covers shell too.
      - name: Run tests with coverage
        run: |
          pytest \
            --cov=src --cov=tools --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-fail-under=85 \
            --junitxml=junit.xml

      - name: Coverage summary
        if: always() && matrix.python-version == '3.13'
        run: |
          {
            echo "### Core coverage (Python ${{ matrix.python-version }})"
            echo '```'
            python -m coverage report --skip-covered || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always() && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v5
        with:
          name: coverage-core
          path: |
            coverage.xml
            htmlcov/
            junit.xml
          retention-days: 14

  python-lint:
    name: Python lint & types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check formatting with black
        run: black --check --diff src tests tools telegram-bot

      - name: Lint with ruff
        run: ruff check --output-format=github src tests tools telegram-bot

      - name: Type check with mypy
        run: mypy src tools telegram-bot/bot.py --ignore-missing-imports

  # --------------------------------------------------------------------------
  # BLE plugins (each is its own Python package)
  # --------------------------------------------------------------------------
  plugin-test:
    name: Plugin ${{ matrix.plugin.dir }} (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
        plugin:
          - { dir: victron-shunt, package: victron_shunt }
          - { dir: renogy-rover, package: renogy_rover }
    defaults:
      run:
        working-directory: plugins/${{ matrix.plugin.dir }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: plugins/${{ matrix.plugin.dir }}/pyproject.toml

      - name: Install plugin
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest-cov ruff

      - name: Lint with ruff
        run: ruff check --output-format=github --select E,F,W,B --ignore E501 .

      - name: Run tests with coverage
        run: |
          pytest -v \
            --cov=${{ matrix.plugin.package }} --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=75

      - name: Coverage summary
        if: always() && matrix.python-version == '3.13'
        run: |
          {
            echo "### ${{ matrix.plugin.dir }} coverage"
            echo '```'
            python -m coverage report --skip-covered || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------------------
  # Shell scripts
  # --------------------------------------------------------------------------
  shell:
    name: Shell lint & tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --version

      - name: Check bash syntax
        run: |
          shopt -s nullglob
          for script in ./*.sh tests/*.sh tests/*/*.sh plugins/*/*.sh; do
            echo "Checking $script..."
            bash -n "$script"
          done

      - name: Run ShellCheck
        run: |
          shopt -s nullglob
          shellcheck -e SC1090,SC1091,SC2034,SC2016,SC2329 -- \
            ./*.sh tests/*.sh tests/*/*.sh plugins/*/*.sh

      - name: Set up Python (for the bootstrap CLI checks)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install bootstrap dependencies
        run: pip install cryptography

      # Runs as the unprivileged runner user, so the "refuses to run without
      # root" checks for the deploy scripts are actually exercised.
      - name: Run script tests
        env:
          NO_COLOR: "1"
        run: ./tests/test-scripts.sh

  docker-compose-validate:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Validate compose files
        run: |
          for file in tests/docker-compose.*.yml tests/target/docker-compose.yml tests/ha-integration/docker-compose.yml; do
            echo "Validating $file..."
            env_args=()
            [[ "$file" == *mac* ]] && env_args=(--env-file tests/.env.mac)
            docker compose -f "$file" "${env_args[@]}" config -q
          done

  frigate-config:
    name: Frigate accepts generated configs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Pull Frigate image
        run: docker pull -q ghcr.io/blakeblackshear/frigate:stable

      - name: Validate deploy and discovery configs with Frigate
        run: ./tests/validate-frigate-configs.sh

  telegram-bot:
    name: Telegram bot container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Builds the image, starts the bot with the compose settings the deploy
      # script generates (read-only, no capabilities, pid: host) and runs the
      # /diag report inside it, checking it works and leaks no password.
      - name: Run the bot container as deployed
        run: SUDO=sudo ./tests/validate-telegram-bot.sh

  integration-test:
    name: Integration test (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [python-test, shell]
    steps:
      - uses: actions/checkout@v5

      - name: Create test directories
        run: |
          mkdir -p tests/mock_storage tests/mosquitto/config tests/frigate-lite

      - name: Start lite test stack
        working-directory: tests
        run: docker compose -f docker-compose.lite.yml up -d

      - name: Wait for services
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5000/api/version >/dev/null; then
              echo "Frigate up after $((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "Frigate did not come up in time"
          exit 1

      - name: Check container status
        run: |
          docker ps
          docker inspect --format='{{.State.Status}}' mosquitto-test | grep -q running
          docker inspect --format='{{.State.Status}}' frigate-test | grep -q running

      - name: Test Mosquitto health
        run: docker exec mosquitto-test mosquitto_sub -t '$SYS/#' -C 1 -W 5

      - name: Test Frigate API
        run: curl -sf http://localhost:5000/api/version

      - name: Collect logs on failure
        if: failure()
        run: docker compose -f tests/docker-compose.lite.yml logs --tail=200

      - name: Cleanup
        if: always()
        run: docker compose -f tests/docker-compose.lite.yml down -v || true
