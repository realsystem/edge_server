name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Python tests
  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest --cov=edge_server --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy

      - name: Check formatting with black
        run: black --check src tests

      - name: Lint with ruff
        run: ruff check src tests

      - name: Type check with mypy
        run: mypy src --ignore-missing-imports
        continue-on-error: true  # Type hints are WIP

  # Shell tests
  shell-lint:
    name: Shell Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          shellcheck -e SC1090,SC1091,SC2034,SC2016,SC2329 \
            secrets.sh \
            initial-setup.sh \
            deploy-edge-server.sh \
            deploy-security.sh \
            tests/test-runner.sh \
            tests/test-runner-full.sh \
            tests/test-lite.sh \
            tests/test-scripts.sh

  shell-syntax:
    name: Shell Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check bash syntax
        run: |
          for script in *.sh tests/*.sh; do
            echo "Checking $script..."
            bash -n "$script"
          done

  shell-unit-tests:
    name: Shell Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run script tests
        run: ./tests/test-scripts.sh

  docker-compose-validate:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose files
        run: |
          for file in tests/docker-compose.*.yml; do
            echo "Validating $file..."
            docker compose -f "$file" config > /dev/null
          done

  integration-test:
    name: Integration Test (Docker)
    runs-on: ubuntu-latest
    needs: [python-test, shell-unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Create test directories
        run: |
          mkdir -p tests/mock_storage
          mkdir -p tests/mosquitto/config
          mkdir -p tests/frigate-lite

      - name: Start lite test stack
        run: |
          cd tests
          docker compose -f docker-compose.lite.yml up -d
          sleep 30

      - name: Check container status
        run: |
          docker ps
          docker inspect --format='{{.State.Status}}' mosquitto-test | grep -q running
          docker inspect --format='{{.State.Status}}' frigate-test | grep -q running

      - name: Test Mosquitto health
        run: |
          docker exec mosquitto-test mosquitto_sub -t '$SYS/#' -C 1 -W 5

      - name: Test Frigate API
        run: |
          curl -sf http://localhost:5000/api/version || exit 1

      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose -f tests/docker-compose.lite.yml logs

      - name: Cleanup
        if: always()
        run: |
          docker compose -f tests/docker-compose.lite.yml down -v || true
