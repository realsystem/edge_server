# Weekly update PRs for dependencies and GitHub Actions; security updates arrive on top of these.
# Only what ships or builds for real is listed: lab and test images stay out so the PR list stays short.
# Merge them like any other PR: CI runs first.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      all: {patterns: ["*"]}
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
  - package-ecosystem: "pip"
    directory: "/plugins/renogy-rover"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
  - package-ecosystem: "pip"
    directory: "/plugins/victron-shunt"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
  - package-ecosystem: "docker"
    directory: "/telegram-bot"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
