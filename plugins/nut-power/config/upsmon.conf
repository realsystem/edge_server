# NUT UPS Monitor configuration

# Monitor the laptop battery
# Format: MONITOR <system> <powervalue> <username> <password> <type>
MONITOR laptop@localhost 1 admin edgeserver master

# Minimum supplies before shutdown (1 = this battery)
MINSUPPLIES 1

# Shutdown command
SHUTDOWNCMD "/sbin/shutdown -h now"

# Notification command (logs to syslog)
NOTIFYCMD /usr/sbin/upssched

# Polling frequency (seconds)
POLLFREQ 30
POLLFREQALERT 5

# Seconds to wait on battery before shutdown
# Default: 600 seconds (10 minutes)
ONBATTERYDELAY 600

# Notify flags
NOTIFYFLAG ONLINE SYSLOG
NOTIFYFLAG ONBATT SYSLOG+WALL
NOTIFYFLAG LOWBATT SYSLOG+WALL
NOTIFYFLAG FSD SYSLOG+WALL
NOTIFYFLAG SHUTDOWN SYSLOG+WALL

# Notification messages
NOTIFYMSG ONLINE "Power restored - running on AC"
NOTIFYMSG ONBATT "Power failure - running on battery"
NOTIFYMSG LOWBATT "Battery low - shutdown imminent"
NOTIFYMSG FSD "Forced shutdown in progress"
NOTIFYMSG SHUTDOWN "System shutdown"

# Run as nut user
RUN_AS_USER nut

# PID file
POWERDOWNFLAG /etc/killpower
